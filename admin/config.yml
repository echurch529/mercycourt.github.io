backend:
  name: github
  repo: echurch529/mercycourt.github.io
  branch: main
  base_url: https://oauth-mercycourt.echurch.workers.dev

publish_mode: editorial_workflow

media_folder: "assets/images/cms-uploads"
public_folder: "/assets/images/cms-uploads"

collections:
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/blog-posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "SEO Title", name: "seo_title", widget: "string" }
      - { label: "SEO Description", name: "seo_description", widget: "text" }
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        time_format: false
      - { label: "Author", name: "author", widget: "string", default: "Mercy Court Team" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "News", value: "news" }
          - { label: "Events", value: "events" }
          - { label: "Inspiration", value: "inspiration" }
      - { label: "Featured Post", name: "featured", widget: "boolean", default: false }
      - { label: "Hero Image", name: "hero_image", widget: "image" }
      - { label: "Hero Image Alt Text", name: "hero_image_alt", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Read Time (minutes)", name: "read_time", widget: "number", value_type: "int", default: 5 }
      - { label: "Body", name: "body", widget: "markdown" }
      - label: "Scripture References"
        name: "scripture_references"
        widget: "list"
        required: false
        field: { label: "Reference", name: "reference", widget: "string" }

  - name: "pages"
    label: "Pages"
    files:

      - name: "ministries"
        label: "Ministries"
        file: "ministries.html"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Background Image", name: "image", widget: "image" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Intro Eyebrow", name: "intro_eyebrow", widget: "string" }
          - { label: "Intro Body", name: "intro_body", widget: "text" }
          - label: "Ministry Cards"
            name: "ministries"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image Alt Text", name: "image_alt", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link URL", name: "link", widget: "string", hint: "Relative path, e.g. mercy-kidz.html" }

      - name: "tehillah"
        label: "Tehillah Voices"
        file: "tehillah-voices.html"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Background Image", name: "image", widget: "image" }
              - { label: "Badge Text", name: "badge", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
          - label: "Vision Section"
            name: "vision"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - label: "Gallery (3 photos)"
            name: "gallery"
            widget: "list"
            max: 3
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "First Paragraph", name: "body1", widget: "text" }
              - { label: "Second Paragraph", name: "body2", widget: "text" }
              - { label: "Instagram URL", name: "instagram_url", widget: "string", hint: "Full URL e.g. https://www.instagram.com/tehillahvoices/" }
          - { label: "YouTube Embed URL", name: "youtube_url", widget: "string", hint: "Full embed URL e.g. https://www.youtube.com/embed/..." }
          - { label: "YouTube Playlist URL", name: "youtube_playlist_url", widget: "string", hint: "Full playlist URL for the Watch on YouTube button" }
          - { label: "Join the Team Form URL", name: "join_url", widget: "string", hint: "Microsoft Forms URL" }
          - { label: "Scripture Quote", name: "scripture_quote", widget: "string" }
          - { label: "Scripture Reference", name: "scripture_ref", widget: "string", hint: "e.g. Psalm 100:4" }
