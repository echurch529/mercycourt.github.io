backend:
  name: github
  repo: echurch529/mercycourt.github.io
  branch: main
  base_url: https://oauth-mercycourt.echurch.workers.dev

publish_mode: editorial_workflow

media_folder: "assets/images/cms-uploads"
public_folder: "/assets/images/cms-uploads"

logo_url: /assets/images/MC LOGO 1080PX black.png
site_url: https://mercycourt.org
display_url: https://mercycourt.org

collections:
  - name: "main-pages"
    label: "Main Pages"
    format: frontmatter
    files:

      - name: "home"
        label: "Homepage"
        file: "index.html"
        fields:
          - label: "Seconds per Slide"
            name: "hero_seconds"
            widget: "number"
            value_type: "int"
            default: 6
            min: 4
            max: 10
            required: false
            hint: "How long each slide is shown before advancing (4–10 s). Only applies when there is more than one slide."
          - label: "Hero Slides"
            name: "hero_slides"
            widget: "list"
            label_singular: "Slide"
            min: 1
            max: 3
            summary: "{{fields.slide_title}} {{fields.headline}}"
            hint: "Put the most important slide first. Up to 3 slides. Keep headlines short."
            fields:
              - { label: "Background Image", name: "image", widget: "image", required: false, hint: "Desktop image: 2071 × 759 px, landscape, under 500 KB. Keep important text away from the edges. Compress at squoosh.app or tinypng.com. Rename descriptively before uploading." }
              - { label: "Image Alt Text", name: "image_alt", widget: "string", required: false, hint: "Required whenever an image is set. For a flyer or event banner, include the key words from the image — event name, date, and place — e.g. 'P4 Conference — 12 Oct 2026 — RCCG Mercy Court, Baltimore'. Screen readers read this aloud and search engines index it." }
              - { label: "Image – Horizontal position", name: "focal_x", widget: "select", default: "50%", required: false, hint: "If a face or key detail is cut off at the sides, move toward that edge.", options: [{ label: "Left", value: "0%" }, { label: "Center-left", value: "25%" }, { label: "Center", value: "50%" }, { label: "Center-right", value: "75%" }, { label: "Right", value: "100%" }] }
              - { label: "Image – Vertical position", name: "focal_y", widget: "select", default: "50%", required: false, hint: "Use 'Top' to keep the top of the photo visible — e.g. when heads are cut off.", options: [{ label: "Top", value: "0%" }, { label: "Upper", value: "25%" }, { label: "Center", value: "50%" }, { label: "Lower", value: "75%" }, { label: "Bottom", value: "100%" }] }
              - { label: "Mobile Image", name: "mobile_image", widget: "image", required: false, hint: "Mobile image (recommended): 1080 × 1350 px portrait version of the flyer, under 500 KB. Phones will show this instead of the desktop image." }
              - { label: "Mobile Image Alt Text", name: "mobile_image_alt", widget: "string", required: false, hint: "Alt text for the mobile image. Required whenever a mobile image is set." }
              - { label: "Show Text Overlay", name: "show_text_overlay", widget: "boolean", default: false, required: false, hint: "Turn on to display the headline, subheading and buttons over the image. Leave off for a full-bleed flyer (text is inside the image itself)." }
              - { label: "Badge", name: "badge", widget: "string", required: false, hint: "Optional small pill above the headline — e.g. 'ANNOUNCING' or 'NEW SERIES'. Leave blank for no badge." }
              - { label: "Headline (first line)", name: "headline", widget: "string", required: false, hint: "Large text overlaid on the image. Leave blank if the headline text is part of the image itself (flyer mode)." }
              - { label: "Headline Highlight (red, second line)", name: "headline_highlight", widget: "string", required: false }
              - { label: "Subheading", name: "subheading", widget: "string", required: false, hint: "Smaller text below the headline. Leave blank for a clean image-only slide." }
              - { label: "Primary Button Text", name: "primary_text", widget: "string", required: false, hint: "e.g. 'Plan Your Visit'" }
              - { label: "Primary Button Link", name: "primary_url", widget: "string", required: false, hint: "e.g. /plan-your-visit" }
              - { label: "Secondary Button Text", name: "secondary_text", widget: "string", required: false }
              - { label: "Secondary Button Link", name: "secondary_url", widget: "string", required: false }
              - { label: "Slide Title (for accessibility)", name: "slide_title", widget: "string", required: false, hint: "Hidden heading used when Headline is blank (flyer mode). Also used as the screen-reader label for the whole-slide link. Required when Headline is blank." }
              - { label: "Slide Link", name: "slide_link", widget: "string", required: false, hint: "Optional. Makes the entire slide clickable — e.g. /events/12th-anniversary. A 'Learn More' button appears at the bottom of the slide." }
              - { label: "Show Until", name: "show_until", widget: "datetime", format: "YYYY-MM-DD", time_format: false, required: false, hint: "Optional. After this date the slide is hidden at the next site build — not at the exact moment the date passes." }
          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Paragraph 1", name: "body1", widget: "text", required: false }
              - { label: "Paragraph 2", name: "body2", widget: "text", required: false }
          - { label: "Mission Body", name: "mission_body", widget: "text", required: false }
          - label: "Leadership Section"
            name: "leadership"
            widget: "object"
            fields:
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - { label: "Blockquote", name: "blockquote", widget: "string", required: false }
          - label: "Ministry Cards"
            name: "ministries"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Image", name: "image", widget: "image", required: false, hint: "Keep under 300KB. Compress at squoosh.app or tinypng.com before uploading." }
              - { label: "Image Alt Text", name: "image_alt", widget: "string", required: false, hint: "Describe the image for screen readers and image search — e.g. 'Worship team leading Sunday service at Mercy Court'" }
              - { label: "Card Title", name: "title", widget: "string", required: false }
              - { label: "Card Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Description", name: "body", widget: "text", required: false }
              - { label: "Link URL", name: "link", widget: "string", required: false, hint: "e.g. tehillah-voices.html" }
          - { label: "CTA Section Body", name: "cta_body", widget: "text", required: false }
          - { label: "Body", name: "body", widget: "hidden" }

      - name: "about"
        label: "About Us"
        file: "about-us.html"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Background Image", name: "image", widget: "image", required: false, hint: "Keep under 500KB. Compress at squoosh.app or tinypng.com before uploading." }
              - { label: "Headline (first line)", name: "headline", widget: "string", required: false, hint: "e.g. IN CHRIST, FOR CHRIST," }
              - { label: "Headline Highlight (red, second line)", name: "headline_highlight", widget: "string", required: false, hint: "e.g. WITH JOY!" }
          - { label: "We Serve God — Paragraph 1", name: "serve_body1", widget: "text", required: false }
          - { label: "We Serve God — Paragraph 2", name: "serve_body2", widget: "text", required: false }
          - label: "Pastor"
            name: "pastor"
            widget: "object"
            fields:
              - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Keep under 300KB. Compress at squoosh.app or tinypng.com before uploading." }
              - { label: "Photo Alt Text", name: "photo_alt", widget: "string", required: false, hint: "Describe the photo for screen readers — e.g. 'Pastor John and Pastor Rosemary Itakpe'" }
              - { label: "Bio Paragraph 1", name: "bio1", widget: "text", required: false }
              - { label: "Bio Paragraph 2", name: "bio2", widget: "text", required: false }
              - { label: "Bio Paragraph 3", name: "bio3", widget: "text", required: false }
          - { label: "Vision — Paragraph 1", name: "vision_body1", widget: "text", required: false }
          - { label: "Vision — Paragraph 2", name: "vision_body2", widget: "text", required: false }
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Quote", name: "quote", widget: "text", required: false }
              - { label: "Attribution", name: "attribution", widget: "string", required: false, hint: "e.g. A Mercy Court Member" }
          - { label: "Body", name: "body", widget: "hidden" }

      - name: "contact"
        label: "Contact"
        file: "contact.html"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Background Image", name: "image", widget: "image", required: false, hint: "Keep under 500KB. Compress at squoosh.app or tinypng.com before uploading." }
          - { label: "Body", name: "body", widget: "hidden" }

      - name: "plan-your-visit"
        label: "Plan Your Visit"
        file: "plan-your-visit.html"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Background Image", name: "image", widget: "image", required: false, hint: "Keep under 500KB. Compress at squoosh.app or tinypng.com before uploading." }
              - { label: "Hero Image Alt Text", name: "image_alt", widget: "string", required: false, hint: "Describe the image for screen readers and image search — e.g. 'Mercy Court congregation during Sunday worship'" }
          - { label: "Welcome Paragraph 1", name: "welcome_body1", widget: "text", required: false }
          - { label: "Welcome Paragraph 2", name: "welcome_body2", widget: "text", required: false }
          - { label: "Welcome Paragraph 3", name: "welcome_body3", widget: "text", required: false }
          - { label: "Welcome Video URL", name: "video_url", widget: "string", required: false, hint: "YouTube embed URL e.g. https://www.youtube.com/embed/..." }
          - label: "FAQ"
            name: "faq"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string", required: false }
              - { label: "Answer", name: "answer", widget: "text", required: false }
          - { label: "Body", name: "body", widget: "hidden" }

      - name: "community-impact"
        label: "Community Impact"
        file: "community-impact.html"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Background Image", name: "image", widget: "image", required: false, hint: "Keep under 500KB. Compress at squoosh.app or tinypng.com before uploading." }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - label: "Mission Section"
            name: "mission"
            widget: "object"
            fields:
              - { label: "Paragraph 1", name: "body1", widget: "text", required: false }
              - { label: "Paragraph 2", name: "body2", widget: "text", required: false }
              - { label: "Paragraph 3", name: "body3", widget: "text", required: false }
          - label: "Impact Stats"
            name: "stats"
            widget: "list"
            summary: "{{fields.number}} — {{fields.label}}"
            fields:
              - { label: "Number", name: "number", widget: "string", required: false, hint: "e.g. 60+ or 8,500+" }
              - { label: "Label", name: "label", widget: "string", required: false }
          - { label: "Pantry Hours Line", name: "pantry_hours", widget: "string", required: false, hint: "One-line summary shown in the orange banner" }
          - label: "Programs"
            name: "programs"
            widget: "list"
            summary: "{{fields.emoji}} {{fields.title}}"
            fields:
              - { label: "Emoji", name: "emoji", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "text", required: false }
          - label: "Community Partners"
            name: "partners"
            widget: "list"
            summary: "{{fields.partner_name}}"
            fields:
              - { label: "Partner Name", name: "partner_name", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.attribution}}"
            fields:
              - { label: "Quote", name: "quote", widget: "text", required: false }
              - { label: "Attribution", name: "attribution", widget: "string", required: false }
          - label: "Food Pantry Highlight"
            name: "pantry_highlight"
            widget: "object"
            fields:
              - { label: "Paragraph 1", name: "body1", widget: "text", required: false }
              - { label: "Paragraph 2", name: "body2", widget: "text", required: false }
              - { label: "Paragraph 3", name: "body3", widget: "text", required: false }
          - label: "Future Goals"
            name: "goals"
            widget: "list"
            summary: "{{fields.emoji}} {{fields.title}}"
            fields:
              - { label: "Emoji", name: "emoji", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "text", required: false }
          - { label: "Volunteer Section — Paragraph 1", name: "volunteer_intro1", widget: "text", required: false }
          - { label: "Volunteer Section — Paragraph 2", name: "volunteer_intro2", widget: "text", required: false }
          - { label: "Volunteer Form Endpoint", name: "volunteer_form_endpoint", widget: "string", required: false, hint: "Formspree URL e.g. https://formspree.io/f/xxxxxxx" }
          - { label: "Grant/Anchor Section Body", name: "grant_body", widget: "text", required: false }
          - { label: "Body", name: "body", widget: "hidden" }

      - name: "blog"
        label: "Blog"
        file: "blog.njk"
        fields:
          - widget: note
            name: "blog_guide"
            label: "ℹ️ How the Blog Page Works"
            hint: |
              HERO — Edit the background image, headline, and tagline below. |
              FEATURED POST — Automatically pulls the most recent post with "Featured Post" turned ON in the Blog Posts section. To change the featured article, go to Blog Posts, open the article you want to feature, and toggle "Featured Post" on (and turn it off on the old one). |
              BLOG GRID — All published posts appear automatically in the grid — no manual editing required.
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Background Image", name: "image", widget: "image", required: false, hint: "Keep under 500KB. Compress at squoosh.app or tinypng.com before uploading." }
              - { label: "Background Image Alt Text", name: "image_alt", widget: "string", required: false, hint: "Describe the image for screen readers — e.g. 'Mercy Court community outreach volunteers'" }
              - { label: "Headline (first line)", name: "headline", widget: "string", required: false, hint: "e.g. Welcome to" }
              - { label: "Headline Highlight (red, second line)", name: "headline_highlight", widget: "string", required: false, hint: "e.g. Mercy Court Blog" }
              - { label: "Tagline", name: "tagline", widget: "string", required: false }
          - label: "Section Intro"
            name: "section"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading (first part)", name: "heading", widget: "string", required: false, hint: "The non-red part of the section heading, e.g. 'News &'" }
              - { label: "Heading Highlight (red word)", name: "heading_highlight", widget: "string", required: false, hint: "e.g. Updates" }
              - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Body", name: "body", widget: "hidden" }

      - name: "events-hub"
        label: "Events"
        file: "events/index.njk"
        fields:
          - widget: note
            name: "events_hub_guide"
            label: "ℹ️ How the Events Hub Works"
            hint: |
              HERO — Edit the badge, title, subheading, and optional background image below. Leave the image blank for the default dark background. |
              CURRENT EVENTS — Cards appear automatically from Event Pages with Status = Active. |
              NO CURRENT EVENTS — The fallback block shows when no active events exist. |
              PAST EVENTS — Cards appear automatically from Event Pages with Status = Past. |
              EVENT CARDS — To add, edit, or archive an event, go to Event Pages.
          - { label: "SEO Title", name: "title", widget: "string", required: false, hint: "Browser-tab title and og:title, e.g. 'Events | RCCG Mercy Court'" }
          - { label: "SEO Description", name: "seo_description", widget: "text", required: false, hint: "Description (target: 120–160 characters)" }
          - { label: "OG / Share Image", name: "og_image", widget: "image", required: false, hint: "Image shown when the page is shared on social media. Leave blank to keep the current default." }
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Badge Text", name: "badge", widget: "string", required: false, hint: "Small text above the title, e.g. 'RCCG Mercy Court'. Leave blank to hide." }
              - { label: "Title", name: "title", widget: "string", required: false, hint: "Large hero heading, e.g. 'Events'" }
              - { label: "Subheading", name: "subheading", widget: "string", required: false, hint: "Smaller text below the title. Leave blank to hide." }
              - { label: "Background Image", name: "image", widget: "image", required: false, hint: "Optional hero background image. Leave blank for the default dark background. Keep under 500KB." }
              - { label: "Background Image Alt Text", name: "image_alt", widget: "string", required: false, hint: "Describe the image for screen readers — only needed when a background image is set." }
              - { label: "Image – Horizontal position", name: "focal_x", widget: "select", default: "50%", required: false, hint: "Shift the focal point if the subject is cut off.", options: [{ label: "Left", value: "0%" }, { label: "Center-left", value: "25%" }, { label: "Center", value: "50%" }, { label: "Center-right", value: "75%" }, { label: "Right", value: "100%" }] }
              - { label: "Image – Vertical position", name: "focal_y", widget: "select", default: "50%", required: false, options: [{ label: "Top", value: "0%" }, { label: "Upper", value: "25%" }, { label: "Center", value: "50%" }, { label: "Lower", value: "75%" }, { label: "Bottom", value: "100%" }] }
          - label: "Current Events Section"
            name: "current_events"
            widget: "object"
            collapsed: true
            hint: "Event cards are managed in Event Pages. Set an event's Status to Active to show it here."
            fields:
              - { label: "Section Heading", name: "heading", widget: "string", default: "Current Events", required: false }
              - { label: "Intro Text", name: "intro", widget: "text", required: false, hint: "Optional paragraph below the heading. Leave blank to omit." }
          - label: "No Current Events Fallback"
            name: "fallback"
            widget: "object"
            collapsed: true
            hint: "Shown when no events are active."
            fields:
              - { label: "Heading", name: "heading", widget: "string", default: "Join Us Every Sunday", required: false }
              - { label: "Text", name: "text", widget: "text", required: false, hint: "Service times and address. Use a new line for each line of text." }
              - { label: "Button Label", name: "button_label", widget: "string", default: "Plan Your Visit", required: false }
              - { label: "Button URL", name: "button_url", widget: "string", default: "/plan-your-visit", required: false }
          - label: "Past Events Section"
            name: "past_events"
            widget: "object"
            collapsed: true
            hint: "Event cards are managed in Event Pages. Set an event's Status to Past to show it here."
            fields:
              - { label: "Section Heading", name: "heading", widget: "string", default: "Past Events", required: false }
              - { label: "Intro Text", name: "intro", widget: "text", required: false, hint: "Optional paragraph below the heading. Leave blank to omit." }
          - { label: "Body", name: "body", widget: "hidden" }

      - name: "give"
        label: "Give"
        file: "give.html"
        fields:
          - { label: "SEO Title", name: "seo_title", widget: "string", required: false }
          - { label: "SEO Description", name: "seo_description", widget: "text", required: false }
          - { label: "OG Image", name: "og_image", widget: "image", required: false, hint: "Keep under 500KB. Compress at squoosh.app or tinypng.com before uploading." }
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Background Image", name: "image", widget: "image", required: false, hint: "Keep under 500KB." }
              - { label: "Image Alt Text", name: "image_alt", widget: "string", required: false }
              - { label: "Headline (first line)", name: "headline", widget: "string", required: false }
              - { label: "Headline Highlight (red, second line)", name: "headline_highlight", widget: "string", required: false }
              - { label: "Subheading", name: "subheading", widget: "string", required: false }
          - label: "Intro"
            name: "intro"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "text", required: false }
          - label: "Why We Give"
            name: "why"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Heading Highlight (red)", name: "heading_highlight", widget: "string", required: false }
              - { label: "Subheading", name: "subheading", widget: "string", required: false }
              - label: "Cards"
                name: "cards"
                widget: "list"
                summary: "{{fields.title}}"
                max: 3
                min: 3
                fields:
                  - { label: "Title", name: "title", widget: "string", required: false }
                  - { label: "Body", name: "body", widget: "text", required: false }
          - label: "Ways to Give"
            name: "ways"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Heading Highlight (red)", name: "heading_highlight", widget: "string", required: false }
              - label: "Zelle Card"
                name: "zelle"
                widget: "object"
                fields:
                  - { label: "Badge Text", name: "badge", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string", required: false }
                  - { label: "Body", name: "body", widget: "string", required: false }
                  - { label: "Button Text", name: "button_text", widget: "string", required: false }
                  - { label: "Button URL", name: "button_url", widget: "string", required: false }
              - label: "Online Card"
                name: "online"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", required: false }
                  - { label: "Body", name: "body", widget: "text", required: false }
                  - { label: "Button Text", name: "button_text", widget: "string", required: false }
                  - { label: "Button URL", name: "button_url", widget: "string", required: false }
              - label: "In Person Card"
                name: "inperson"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", required: false }
                  - { label: "Body", name: "body", widget: "text", required: false }
                  - { label: "Button Text", name: "button_text", widget: "string", required: false }
                  - { label: "Button URL", name: "button_url", widget: "string", required: false }
              - label: "By Mail Card"
                name: "mail"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", required: false }
                  - { label: "Body", name: "body", widget: "text", required: false }
                  - { label: "Button Text", name: "button_text", widget: "string", required: false }
                  - { label: "Button URL", name: "button_url", widget: "string", required: false }
          - label: "Give via Zelle Section"
            name: "zelle_section"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Heading Highlight (red)", name: "heading_highlight", widget: "string", required: false }
              - { label: "Intro Text", name: "intro", widget: "text", required: false }
          - label: "Online Giving Section"
            name: "online_section"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Heading Highlight (red)", name: "heading_highlight", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "string", required: false }
          - label: "Building Project Section"
            name: "building"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "text", required: false }
              - { label: "Button Text", name: "button_text", widget: "string", required: false }
