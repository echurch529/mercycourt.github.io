            widget: "list"
            required: false
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - { label: "Button Text", name: "button_text", widget: "string", default: "PLAN MY VISIT", required: false }

      - label: "Giving / Donation Section"
        name: "giving"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Heading", name: "heading", widget: "string", required: false, hint: "Leave blank to hide this entire section" }
          - { label: "Body", name: "body", widget: "text", required: false }
          - { label: "Button Text", name: "button_text", widget: "string", default: "Give Now", required: false }
          - { label: "Giving URL", name: "url", widget: "string", required: false, hint: "Zeffy, Stripe, or direct giving link" }

  - name: "posts"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/blog-posts"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - widget: note
        name: writing_guide
        label: "📝 Writing Guide"
        hint: |
          HEADINGS — Use ## for major sections (e.g. ## Key One), ### for sub-headings (e.g. FAQ questions). Do NOT write numbered lists (1. **Bold:**) as section headers — they render as a plain list, not headings. |
          LINKS — Use [link text](url) syntax. Never leave placeholder text like (link to mercycourt.org/...). |
          SEO TITLE — Must end with | Mercy Court, e.g. Your Post Title | Mercy Court. |
          IMAGE — Rename the file descriptively before uploading (e.g. total-commitment-hero.jpg, not IMG_1234.jpg). |
          FAQ SCHEMA — If the post has a FAQ section, populate the FAQ field at the bottom to auto-generate SEO structured data. |
          COMMUNITY IMPACT — Turn on "Community Impact Feature" to feature this post in the news section on the Community Impact page.
      - { label: "Title", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string", hint: "Slug — derive from the title, shortened if needed. Lowercase letters and hyphens only, no leading slash. e.g. baltimore-food-pantry-outreach not /baltimore-food-pantry-outreach." }
      - { label: "SEO Title", name: "seo_title", widget: "string", required: false, hint: "Search-engine title. Must end with | Mercy Court — e.g. 'Total Commitment to God: 5 Keys | Mercy Court'. Target 50–60 characters." }
      - { label: "SEO Description", name: "seo_description", widget: "text", required: false, hint: "Description (target: 120–160 characters)" }
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        time_format: false
      - { label: "Author", name: "author", widget: "string", default: "Mercy Court Team", required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - { label: "News", value: "news" }
          - { label: "Events", value: "events" }
          - { label: "Inspiration", value: "inspiration" }
      - { label: "Featured Post", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Community Impact Feature", name: "community_impact", widget: "boolean", default: false, required: false, hint: "Turn ON to feature this post in the 'Latest News' section on the Community Impact page." }
      - { label: "Hero Image", name: "hero_image", widget: "image", required: false, hint: "Rename the file descriptively before uploading (e.g. total-commitment-hero.jpg, not IMG_1234.jpg or stockphoto.jpg). Keep under 500KB — compress at squoosh.app or tinypng.com." }
      - { label: "Hero Image Alt Text", name: "hero_image_alt", widget: "string", required: false, hint: "Required whenever an image is set. Describe the image for screen readers and image search — e.g. 'Open Bible on wooden table with morning light'" }
